<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan4Strength</title>
</head>
<body>
  <script>
    var go = '/';
    try {
      var saved = localStorage.getItem('workoutPlan');
      if (saved) {
        var plan = JSON.parse(saved);
        if (plan && Array.isArray(plan.plan)) {
          go = '/workout.html';
        }
      }
    } catch (e) { /* JSON parse failure → stay on / */ }
    location.replace(go);
  </script>
</body>
</html>
