<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan4Strength</title>
</head>
<body>
  <script src="/js/nextWorkout.js"></script>
  <script>
    var go = '/';
    try {
      var saved = localStorage.getItem('workoutPlan');
      if (saved) {
        var plan = JSON.parse(saved);
        if (plan && Array.isArray(plan.plan)) {
          var planId = null;
          try { planId = localStorage.getItem('workoutPlanSavedId'); } catch (e2) { /* ignore */ }
          if (typeof NextWorkout !== 'undefined' && NextWorkout.runnerStartHrefForPlan) {
            go = NextWorkout.runnerStartHrefForPlan(plan, planId, localStorage);
          } else if (planId) {
            go = '/workout.html?setup=1&planId=' + encodeURIComponent(planId);
          } else {
            go = '/workout.html';
          }
        }
      }
    } catch (e) { /* JSON parse failure -> stay on / */ }
    location.replace(go);
  </script>
</body>
</html>
