<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Account - Plan4Strength</title>
  <link rel="stylesheet" href="css/tailwind-compiled.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen has-bottom-nav">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-blue-900">Account</h1>
      </div>
    </header>

    <section id="guestSection" class="bg-white rounded-xl shadow p-6 max-w-md">
      <h2 class="text-xl font-bold mb-2">Save your training</h2>
      <p class="text-gray-600 mb-4">Sign in to save plans, keep history, and set equipment and music defaults. Plans still generate without an account.</p>
      <button id="signInBtn" type="button" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition">Sign in / Register</button>
      <a href="/" class="block w-full text-center text-sm text-gray-500 hover:text-gray-700 mt-3 transition">Create a plan →</a>
    </section>

    <section id="accountSection" class="hidden">
      <div class="bg-white rounded-xl shadow p-6 max-w-md space-y-6">
        <div>
          <div class="text-sm text-gray-500 mb-1">Signed in as</div>
          <div id="accountEmail" class="font-medium text-gray-900"></div>
        </div>

        <div class="border-t border-gray-100 pt-4">
          <label class="flex items-center justify-between gap-3 cursor-pointer">
            <span class="text-sm font-medium text-gray-700">Dark mode</span>
            <input id="contrastToggle" type="checkbox" class="rounded text-blue-600 w-5 h-5" />
          </label>
        </div>

        <div class="border-t border-gray-100 pt-4 space-y-2">
          <a href="/?open=preferences" class="block text-sm text-blue-700 hover:underline">Equipment &amp; music defaults →</a>
          <a href="/privacy" class="block text-sm text-blue-700 hover:underline">Privacy →</a>
        </div>

        <div class="border-t border-gray-100 pt-4">
          <button id="logOutBtn" type="button" class="w-full text-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-semibold py-2 px-4 rounded-md transition">Log out</button>
        </div>
      </div>
    </section>
  </div>

  <nav id="bottomNav" class="bottom-nav no-print" aria-label="Main">
    <div class="bottom-nav__side">
      <a href="/" class="bottom-nav__item" data-nav="planner">
        <span class="bottom-nav__icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="4" rx="1"/><path d="M7 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M8 12h8M8 16h5"/></svg></span>
        <span>Planner</span>
      </a>
      <a href="/history.html" class="bottom-nav__item" data-nav="history">
        <span class="bottom-nav__icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></span>
        <span>History</span>
      </a>
    </div>
    <a href="/workout.html" class="bottom-nav__item bottom-nav__item--primary" data-nav="workout">
      <span class="bottom-nav__icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7-11-7z"/></svg></span>
      <span>Workout</span>
    </a>
    <div class="bottom-nav__side">
      <a href="/account.html" id="bottomNavAccount" class="bottom-nav__item" data-nav="account">
        <span class="bottom-nav__icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.2-3 3.4-4.5 7-4.5S17.8 16 19 19"/></svg></span>
        <span>Account</span>
      </a>
    </div>
  </nav>

  <script src="js/site.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
