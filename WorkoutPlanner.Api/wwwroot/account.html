<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Account - Plan4Strength</title>
  <link rel="stylesheet" href="css/tailwind-compiled.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen has-bottom-nav">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-blue-900">Account</h1>
      </div>
    </header>

    <section id="guestSection" class="bg-white rounded-xl shadow p-6 max-w-md">
      <h2 class="text-xl font-bold mb-2">Save your training</h2>
      <p class="text-gray-600 mb-4">Sign in to save plans, keep history, and set equipment and music defaults. Plans still generate without an account.</p>
      <button id="signInBtn" type="button" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition">Sign in / Register</button>
      <a href="/" class="block w-full text-center text-sm text-gray-500 hover:text-gray-700 mt-3 transition">Create a plan →</a>
    </section>

    <section id="accountSection" class="hidden">
      <div class="bg-white rounded-xl shadow p-6 max-w-md space-y-6">
        <div>
          <div class="text-sm text-gray-500 mb-1">Signed in as</div>
          <div id="accountEmail" class="font-medium text-gray-900"></div>
        </div>

        <div class="border-t border-gray-100 pt-4">
          <label class="flex items-center justify-between gap-3 cursor-pointer">
            <span class="text-sm font-medium text-gray-700">Dark mode</span>
            <input id="contrastToggle" type="checkbox" class="rounded text-blue-600 w-5 h-5" />
          </label>
        </div>

        <div class="border-t border-gray-100 pt-4 space-y-2">
          <a href="/?open=preferences" class="block text-sm text-blue-700 hover:underline">Equipment &amp; music defaults →</a>
          <a href="/privacy" class="block text-sm text-blue-700 hover:underline">Privacy →</a>
        </div>

        <div class="border-t border-gray-100 pt-4">
          <button id="logOutBtn" type="button" class="w-full text-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-800 font-semibold py-2 px-4 rounded-md transition">Log out</button>
        </div>
      </div>
    </section>
  </div>

  <nav id="bottomNav" class="bottom-nav no-print" aria-label="Main">
    <a href="/" class="bottom-nav__item" data-nav="planner">
      <span class="bottom-nav__icon" aria-hidden="true">📋</span>
      <span>Planner</span>
    </a>
    <a href="/history.html" class="bottom-nav__item" data-nav="history">
      <span class="bottom-nav__icon" aria-hidden="true">📈</span>
      <span>History</span>
    </a>
    <a href="/workout.html" class="bottom-nav__item" data-nav="run">
      <span class="bottom-nav__icon" aria-hidden="true">▶</span>
      <span>Run</span>
    </a>
    <a href="/help.html" class="bottom-nav__item" data-nav="help">
      <span class="bottom-nav__icon" aria-hidden="true">❓</span>
      <span>Help</span>
    </a>
    <a href="/account.html" id="bottomNavAccount" class="bottom-nav__item bottom-nav__item--active" data-nav="account" aria-current="page">
      <span class="bottom-nav__icon" aria-hidden="true">👤</span>
      <span>Account</span>
    </a>
  </nav>

  <script src="js/site.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
