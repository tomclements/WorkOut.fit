<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Feedback - Plan4Strength</title>
  <link rel="stylesheet" href="css/tailwind-compiled.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen has-bottom-nav">
  <div class="max-w-xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-extrabold tracking-tight text-blue-900">Send feedback</h1>
      <p class="text-gray-600 mt-2">
        No account needed. Share ideas, bugs, or anything that would make Plan4Strength better.
      </p>
    </header>

    <section id="feedbackFormSection" class="bg-white rounded-xl shadow p-6 mb-6">
      <form id="feedbackForm" class="space-y-4" novalidate>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="feedbackCategory">Type</label>
          <select id="feedbackCategory" name="category" class="w-full border border-gray-300 rounded-md p-2 text-sm">
            <option value="suggestion" selected>Suggestion / idea</option>
            <option value="bug">Bug / something broken</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="feedbackMessage">Your message <span class="text-red-600">*</span></label>
          <textarea id="feedbackMessage" name="message" rows="6" maxlength="4000" required
            placeholder="What would help? Steps to reproduce a bug, feature ideas, confusing bits…"
            class="w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
          <p class="text-xs text-gray-500 mt-1">A few sentences is perfect.</p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="feedbackEmail">Email (optional)</label>
          <input id="feedbackEmail" name="contactEmail" type="email" maxlength="256" autocomplete="email"
            placeholder="Only if you want a reply"
            class="w-full border border-gray-300 rounded-md p-2 text-sm" />
        </div>

        <!-- Honeypot: leave empty -->
        <div class="hidden" aria-hidden="true">
          <label for="feedbackWebsite">Website</label>
          <input id="feedbackWebsite" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <p id="feedbackError" class="hidden text-sm text-red-600"></p>
        <button id="feedbackSubmitBtn" type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-3 px-4 rounded-xl transition">
          Send feedback
        </button>
      </form>
    </section>

    <section id="feedbackThanks" class="hidden bg-white rounded-xl shadow p-6 mb-6 text-center">
      <div class="text-4xl mb-3" aria-hidden="true">✓</div>
      <h2 class="text-xl font-bold text-blue-900 mb-2">Thanks — we got it</h2>
      <p id="feedbackThanksMsg" class="text-gray-700 mb-4">Your feedback was received.</p>
      <a href="/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-5 rounded-lg">Back to planner</a>
      <button id="sendAnotherBtn" type="button" class="block w-full mt-3 text-blue-700 font-semibold py-2">Send another</button>
    </section>
  </div>

  <nav id="bottomNav" class="bottom-nav no-print" aria-label="Main">
    <a href="/" class="bottom-nav__item" data-nav="planner">
      <span class="bottom-nav__icon" aria-hidden="true">📋</span>
      <span>Planner</span>
    </a>
    <a href="/history.html" class="bottom-nav__item" data-nav="history">
      <span class="bottom-nav__icon" aria-hidden="true">📈</span>
      <span>History</span>
    </a>
    <a href="/workout.html" class="bottom-nav__item" data-nav="run">
      <span class="bottom-nav__icon" aria-hidden="true">▶</span>
      <span>Run</span>
    </a>
    <a href="/help.html" class="bottom-nav__item" data-nav="help">
      <span class="bottom-nav__icon" aria-hidden="true">❓</span>
      <span>Help</span>
    </a>
    <a href="#" id="bottomNavAccount" class="bottom-nav__item" data-nav="account">
      <span class="bottom-nav__icon" aria-hidden="true">👤</span>
      <span>Account</span>
    </a>
  </nav>

  <script src="js/site.js"></script>
  <script>
    const form = document.getElementById('feedbackForm');
    const formSection = document.getElementById('feedbackFormSection');
    const thanks = document.getElementById('feedbackThanks');
    const errEl = document.getElementById('feedbackError');
    const submitBtn = document.getElementById('feedbackSubmitBtn');
    const thanksMsg = document.getElementById('feedbackThanksMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      const message = document.getElementById('feedbackMessage').value.trim();
      if (message.length < 5) {
        errEl.textContent = 'Please write at least a few words.';
        errEl.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            category: document.getElementById('feedbackCategory').value,
            message,
            contactEmail: document.getElementById('feedbackEmail').value.trim() || null,
            pageUrl: location.href,
            website: document.getElementById('feedbackWebsite').value
          })
        });

        let data = {};
        try { data = await res.json(); } catch { /* ignore */ }

        if (res.status === 429) {
          throw new Error('Too many submissions. Please try again in a few minutes.');
        }
        if (!res.ok) {
          const msg = data.message
            || (data.errors && Object.values(data.errors).flat().join(' '))
            || 'Could not send feedback. Please try again.';
          throw new Error(msg);
        }

        thanksMsg.textContent = data.message || 'Your feedback was received.';
        formSection.classList.add('hidden');
        thanks.classList.remove('hidden');
        if (typeof showToast === 'function') showToast('Feedback sent — thank you!', 'success');
        form.reset();
      } catch (err) {
        errEl.textContent = err.message || 'Something went wrong.';
        errEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send feedback';
      }
    });

    document.getElementById('sendAnotherBtn').addEventListener('click', () => {
      thanks.classList.add('hidden');
      formSection.classList.remove('hidden');
    });
  </script>
</body>
</html>
